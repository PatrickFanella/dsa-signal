name: PR CI

# Pull-request checks on GitHub-hosted runners. Main-branch builds and deploys
# stay in .gitea/workflows on Gitea Actions.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Template baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # The reviewed Compose render goldens come from Docker Compose v5.7.0
      # (Kvant's runner); the hosted image ships an older Compose.
      - name: Install Docker Compose v5.7.0
        run: |
          set -euo pipefail
          url=https://github.com/docker/compose/releases/download/v5.7.0/docker-compose-linux-x86_64
          curl -fsSL -o docker-compose "$url"
          echo '7758048ad38e580f22559603312874fec8bb638d021a9e64182385fc17cc12a2  docker-compose' | sha256sum -c -
          mkdir -p ~/.docker/cli-plugins
          install -m 0755 docker-compose ~/.docker/cli-plugins/docker-compose
          rm docker-compose
          docker compose version
      # The integration tests match Docker 29 CLI diagnostics (Kvant's runner);
      # the hosted image ships an older client.
      - name: Install Docker CLI 29.9.3
        run: |
          set -euo pipefail
          curl -fsSL -o docker.tgz https://download.docker.com/linux/static/stable/x86_64/docker-29.9.3.tgz
          echo '3fb5d1f13014c18cc54945bc177c58a9056a482dada031e17d12cf2e6922c973  docker.tgz' | sha256sum -c -
          tar -xzf docker.tgz docker/docker
          sudo install -m 0755 docker/docker /usr/local/bin/docker
          rm -rf docker docker.tgz
          hash -r
          docker version
      - name: Pull locked Postgres image
        run: docker pull "$(sed -n 's/^POSTGRES_IMAGE=//p' deploy/locks/images.env)"
      - name: Verify template baseline
        run: |
          if ! command -v tini >/dev/null; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends tini
          fi
          exec tini -s -- make verify

  ci-gate:
    name: CI gate
    if: always()
    needs: [verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every verification job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ["RESULTS"])
          expected = {'verify'}
          assert set(results) == expected, results
          for name, result in results.items():
              assert result["result"] == "success", name + " did not pass"
          PY
